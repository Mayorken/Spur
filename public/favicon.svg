<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Spur Favicon - S Lightning + Spur -->
  <rect width="240" height="240" fill="#0a0a0a"/>

  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b300ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7d00b3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c026d3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- S-Lightning (Purple) -->
  <path d="M 85 35 Q 120 40 130 70 L 155 55 Q 145 20 95 15 Q 60 12 55 35 Z"
        fill="url(#purpleGrad)" stroke="#b300ff" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 130 70 L 145 110 L 115 115 L 140 160 L 105 155 L 100 200"
        fill="none" stroke="url(#purpleGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 115 115 Q 85 125 75 155 Q 70 175 85 190 Q 110 205 135 200 L 145 175 Q 130 180 115 175 Q 100 170 105 155 Z"
        fill="url(#purpleGrad)" stroke="#b300ff" stroke-width="3" stroke-linejoin="round"/>

  <!-- Horse Spur (Purple Accent) -->
  <g transform="translate(160, 70)">
    <path d="M -15 0 L -20 -25 L -25 -20 Z" fill="url(#purpleAccentGrad)" stroke="#d946ef" stroke-width="3" stroke-linejoin="miter"/>
    <circle cx="0" cy="0" r="8" fill="#d946ef"/>
    <line x1="0" y1="0" x2="0" y2="-20" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="19" y2="-6" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="12" y2="16" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-12" y2="16" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="-19" y2="-6" stroke="#d946ef" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="8" y2="15" stroke="#d946ef" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>